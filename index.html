<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Cobrinha</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --grid: #1f2937;
        --snake: #22c55e;
        --snake-head: #16a34a;
        --food: #ef4444;
        --text: #e5e7eb;
        --accent: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-box {
        background: rgba(17, 24, 39, 0.9);
        border: 2px solid rgba(96, 165, 250, 0.5);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        padding: 20px;
      }

      h1 {
        margin: 0 0 14px;
        text-align: center;
        font-size: clamp(1.5rem, 2vw, 2.2rem);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .score {
        color: var(--accent);
      }

      canvas {
        display: block;
        background: var(--grid);
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        width: min(80vw, 420px);
        height: auto;
        image-rendering: pixelated;
      }

      .controls {
        display: flex;
        justify-content: center;
        margin-top: 14px;
        gap: 12px;
      }

      button {
        border: none;
        background: linear-gradient(135deg, var(--accent), #2563eb);
        color: white;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      @media (max-width: 420px) {
        .game-box {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-box">
      <h1>Jogo da Cobrinha</h1>

      <div class="hud">
        <span>Pontos: <span id="score" class="score">0</span></span>
        <span id="status">Jogando</span>
      </div>

      <canvas id="game" width="400" height="400" aria-label="Jogo da cobrinha"></canvas>

      <div class="controls">
        <button id="restart" type="button">Reiniciar</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const statusEl = document.getElementById('status');
      const restartBtn = document.getElementById('restart');

      const gridSize = 20;
      const tileSize = canvas.width / gridSize;
      let snake;
      let direction;
      let nextDirection;
      let food;
      let score;
      let gameLoop;
      let isGameOver;

      function initGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        isGameOver = false;
        scoreEl.textContent = score;
        statusEl.textContent = 'Jogando';
        spawnFood();
        clearInterval(gameLoop);
        gameLoop = setInterval(update, 130);
      }

      function spawnFood() {
        let x;
        let y;

        do {
          x = Math.floor(Math.random() * gridSize);
          y = Math.floor(Math.random() * gridSize);
        } while (snake.some((segment) => segment.x === x && segment.y === y));

        food = { x, y };
      }

      function update() {
        if (isGameOver) return;

        direction = nextDirection;

        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        const hitWall = head.x < 0 || head.y < 0 || head.x >= gridSize || head.y >= gridSize;
        const hitSelf = snake.some((segment) => segment.x === head.x && segment.y === head.y);

        if (hitWall || hitSelf) {
          isGameOver = true;
          statusEl.textContent = 'Fim de jogo';
          clearInterval(gameLoop);
          draw();
          return;
        }

        snake.unshift(head);

        const ateFood = head.x === food.x && head.y === food.y;

        if (ateFood) {
          score += 10;
          scoreEl.textContent = score;
          spawnFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1f2937';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let x = 0; x < gridSize; x++) {
          for (let y = 0; y < gridSize; y++) {
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
          }
        }

        snake.forEach((segment, index) => {
          ctx.fillStyle = index === 0 ? '#16a34a' : '#22c55e';
          ctx.fillRect(
            segment.x * tileSize + 1,
            segment.y * tileSize + 1,
            tileSize - 2,
            tileSize - 2
          );
        });

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(
          food.x * tileSize + 3,
          food.y * tileSize + 3,
          tileSize - 6,
          tileSize - 6
        );

        if (isGameOver) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 32px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '18px Arial';
          ctx.fillText('Pressione reiniciar', canvas.width / 2, canvas.height / 2 + 24);
        }
      }

      function changeDirection(newDir) {
        if (isGameOver) return;

        const isOpposite =
          newDir.x === -direction.x && newDir.y === -direction.y;

        if (!isOpposite) {
          nextDirection = newDir;
        }
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();

        if (key === 'arrowup' || key === 'w') {
          changeDirection({ x: 0, y: -1 });
        } else if (key === 'arrowdown' || key === 's') {
          changeDirection({ x: 0, y: 1 });
        } else if (key === 'arrowleft' || key === 'a') {
          changeDirection({ x: -1, y: 0 });
        } else if (key === 'arrowright' || key === 'd') {
          changeDirection({ x: 1, y: 0 });
        }
      });

      restartBtn.addEventListener('click', () => {
        initGame();
        draw();
      });

      initGame();
      draw();
    </script>
  </body>
</html>
